name: Concesiones SERNAGEOMIN — Sync Semanal

on:
  schedule:
    # Todos los lunes a las 03:00 CLT (06:00 UTC)
    - cron: '0 6 * * 1'
  workflow_dispatch:   # trigger manual desde GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet urllib3

      - name: Sincronizar concesiones
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/sync-concesiones.py
