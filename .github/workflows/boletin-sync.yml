name: Boletín Minería — Sync Diario

on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync endpoint
        run: |
          curl -sf -X GET \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/boletin/sync?secret=${{ secrets.BOLETIN_SYNC_SECRET }}" \
            | jq .
