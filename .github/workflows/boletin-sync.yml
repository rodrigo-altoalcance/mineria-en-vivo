name: Boletín Minería — Sync Diario

on:
  schedule:
        - cron: '0 15 * * *'  # 11:00 CLT (15:00 UTC)
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a sincronizar (YYYY-MM-DD). Vacío = hoy/última edición disponible.'
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Trigger sync endpoint
        env:
          FECHA: ${{ inputs.fecha }}
        run: |
          set -o pipefail
          URL="${{ secrets.NEXT_PUBLIC_APP_URL }}/api/boletin/sync?secret=${{ secrets.BOLETIN_SYNC_SECRET }}"
          if [ -n "$FECHA" ]; then
            URL="${URL}&fecha=${FECHA}"
          fi
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X GET "$URL")
          jq . /tmp/resp.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Sync falló con HTTP $HTTP_CODE"
            exit 1
          fi
