name: Boletín Minería — Sync Diario

on:
  schedule:
        - cron: '0 15 * * *'  # 11:00 CLT (15:00 UTC)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Trigger sync endpoint
        run: |
          set -o pipefail
          curl -sf -X GET \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/boletin/sync?secret=${{ secrets.BOLETIN_SYNC_SECRET }}" \
            | jq .
